name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: zachary822/setup-zig@v1
        with:
          version: 0.17.0
      - name: Format
        run: zig fmt --check .
      # The tests do not send requests to PostHog.
      - name: Test
        run: zig build test --summary all
